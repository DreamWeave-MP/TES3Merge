# tes3merge as a DreamWeave project: a Jess package. `jess` names the Package Source it
# publishes, the jess.toml at the repository root, and each release tag `tes3merge-<version>` is one
# version of the package, packed by the Mod Template from that tag; every push packs a
# development build.
id = "13fe2321-0f57-4368-9690-50400d433c61"
slug = "tes3merge"
type = "tool"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[[credits]]
name = "NullCascade"
role = "TES3Merge, the original: this package is a port of it, under its MIT license (LICENSES/TES3Merge-LICENSE-MIT.txt)"
url = "https://github.com/NullCascade/TES3Merge"

[package]
format = "jpk"
jess = "org.dreamweave.tes3merge"

[[releases]]
version = "0.1.0"
date = 2026-10-21
summary = "First release published as a DreamWeave project."

[[releases]]
version = "0.1.1"
date = 2026-10-23
summary = "The merge finds OpenMW's own configuration when none is named."
added = [
    "With neither `--config` nor OPENMW_CONFIG, the openmw.cfg in the folder OpenMW keeps its own in on this platform: Documents\\My Games\\OpenMW on Windows, wherever Documents was moved, Library/Preferences/openmw on macOS, and the XDG config folder elsewhere. Its `?userconfig?` and `?userdata?` are OpenMW's own folders. Needs jess 0.2.1 or later.",
]
