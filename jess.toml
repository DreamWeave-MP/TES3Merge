manifest_version = 1

[package]
id = "org.dreamweave.tes3merge"
version = "0.1.0"
jess_api = "1"
include = ["src"]
tests = ["tests/run.luau"]

[dependencies]
"org.dreamweave.tes3" = "0.1"
"org.dreamweave.tes3cmd" = "0.1"
"org.dreamweave.load-order" = "0.1"
"org.dreamweave.openmw" = "0.1"

[modules]
"@tes3merge" = "src/init.luau"

# The module is inert API: it does nothing until something requires it, and runs with the
# authority of whatever calls it. A merge reads the load order's content files and writes the
# merged plugin, so its caller needs both.

[[layer]]
id = "tes3merge.core"
requires = ["tes3.core", "tes3cmd.core", "load-order.core", "openmw.core"]
exports = ["@tes3merge"]
