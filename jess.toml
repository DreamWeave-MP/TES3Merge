manifest_version = 1

[package]
id = "org.dreamweave.tes3merge"
version = "0.1.0"
jess_api = "1"
default_target = "tes3merge"
include = ["src"]
tests = ["tests/run.jsl", "tests/cli.jsl", "tests/style.jsl"]

[dependencies]
"org.dreamweave.tes3" = "0.1"
"org.dreamweave.load-order" = "0.1"
"org.dreamweave.openmw" = "0.1"

[modules]
"@tes3merge" = "src/init.jsl"
"@tes3merge/cli" = "src/cli.jsl"

# Every module here is inert API: it does nothing until something requires it, and runs with the
# authority of whatever calls it. A merge reads the load order's content files and writes the
# merged plugin, so its caller needs both.

[[layer]]
id = "tes3merge.core"
requires = ["tes3.core", "load-order.core", "openmw.core"]
exports = ["@tes3merge", "@tes3merge/cli"]

# The merge's command line: `src/main.jsl` hands its arguments to `@tes3merge/cli`. A run reads
# the configuration chain, its data folders' listings, and the content files (filesystem.read);
# makes the output folder, writes the merged plugin, and with --activate backs up and rewrites
# openmw.cfg (filesystem.write); and reads OPENMW_CONFIG when --config doesn't name the
# configuration (process.environment). It runs no other program and opens no connection.

[targets.tes3merge]
kind = "command"
command = "tes3merge"
entry = "src/main.jsl"
capabilities = ["filesystem.read", "filesystem.write", "process.environment"]
