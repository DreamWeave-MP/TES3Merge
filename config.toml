base_url = "https://dreamweave-mp.github.io/tes3merge"
title = "tes3merge"
description = "Merges the records of a Morrowind load order into one patch plugin, a port of NullCascade's TES3Merge, as a Jess package and command in Luau."
compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]
taxonomies = [{ name = "tags", feed = false }]

[search]
index_format = "fuse_json"
include_title = true
include_description = true
include_content = true
truncate_content_length = 400

[markdown]
highlighting = { theme = "dracula-soft" }
insert_anchor_links = "right"
smart_punctuation = true

[slugify]
paths = "safe"

[link_checker]
skip_prefixes = ["https://github.com/", "https://www.nexusmods.com/"]

[extra]
github_username = "DreamWeave-MP"
github_project = "tes3merge"
logo_text = "tes3merge"
palette = "teal"
menu_items = [
    { name = "tes3merge", url = "@/home/index.md" },
    { name = "Network", url = "@/network.md" },
]

[extra.comments]
enabled = false
category = "General"
